name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    name: Ponta a ponta (GitHub simulado por repositório local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependências
        run: sudo apt-get install -y -q shellcheck
      - name: ShellCheck
        run: shellcheck -S warning git-em-producao.sh tests/test.sh
      - name: Teste de ponta a ponta
        run: sudo ./tests/test.sh
